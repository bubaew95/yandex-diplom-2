syntax = "proto3";

package gokeeper;

option go_package = "github.com/bubaew95/yandex-diplom-2/internal/proto;proto";



service GoKeeper {
  rpc Registration(RegistrationRequest) returns(TokenResponse);
  rpc Login(LoginRequest) returns(TokenResponse);

  rpc Add(DataRequest) returns(DataResponse);
  rpc Edit(DataEditRequest) returns(DataResponse);
  rpc Delete(IdRequest) returns(SuccessResponse);
  rpc FindAll(EmptyRequest) returns(DataList);
}

message RegistrationRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  string re_password = 5;
}
message LoginRequest {
  string email = 1;
  string password = 2;
}
message TokenResponse {
  string token = 1;
}

message EmptyRequest {}

message DataRequest {
  string text = 1;
  string type = 2;
}
message DataEditRequest {
  int64 id = 1;
  string text = 2;
}
message DataResponse {
  int64 id = 1;
  string text = 2;
  string type = 3;
  int64 user_id = 4;
  bool is_deleted = 5;
}
message DataList {
  repeated DataResponse List = 1;
}

message IdRequest {
  int64 id = 1;
}
message SuccessResponse {
  bool success = 1;
}